<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Admission Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        form { max-width: 600px; margin: auto; }
        fieldset { margin-bottom: 20px; padding: 20px; }
        legend { font-weight: bold; }
        label { display: block; margin-top: 10px; }
        .form-group { margin-bottom: 10px; }
        .buttons { margin-top: 20px; }
    </style>
</head>
<body>
    <h2>University Admission Form</h2>
    <form action="#" method="post" enctype="multipart/form-data">
        
        <fieldset>
            <legend>Personal Information</legend>
            <div class="form-group">
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname" required maxlength="30">
            </div>
            <div class="form-group">
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname" required maxlength="30">
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male" style="display:inline;">Male</label>
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female" style="display:inline;">Female</label>
                <input type="radio" id="other" name="gender" value="Other">
                <label for="other" style="display:inline;">Other</label>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required maxlength="50">
            </div>
        </fieldset>

        
        <fieldset>
            <legend>Academic Information</legend>
            <div class="form-group">
                <label for="highschool">High School Name:</label>
                <input type="text" id="highschool" name="highschool" required maxlength="50">
            </div>
            <div class="form-group">
                <label for="gradyear">Year of Graduation:</label>
                <input type="number" id="gradyear" name="gradyear" required min="1950" max="2099">
            </div>
            <div class="form-group">
                <label for="department">Preferred Department:</label>
                <select id="department" name="department" required>
                    <option value="">--Select Department--</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Business">Business</option>
                    <option value="Arts">Arts</option>
                    <option value="Science">Science</option>
                </select>
            </div>
            <div class="form-group">
                <label>Interests:</label>
                <input type="checkbox" id="sports" name="interests[]" value="Sports">
                <label for="sports" style="display:inline;">Sports</label>
                <input type="checkbox" id="music" name="interests[]" value="Music">
                <label for="music" style="display:inline;">Music</label>
                <input type="checkbox" id="tech" name="interests[]" value="Technology">
                <label for="tech" style="display:inline;">Technology</label>
                <input type="checkbox" id="arts" name="interests[]" value="Arts">
                <label for="arts" style="display:inline;">Arts</label>
            </div>
        </fieldset>

       
        <fieldset>
            <legend>Upload Documents</legend>
            <div class="form-group">
                <label for="resume">Resume (PDF/DOC):</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
            </div>
            <div class="form-group">
                <label for="transcript">High School Transcript (PDF):</label>
                <input type="file" id="transcript" name="transcript" accept=".pdf" required>
            </div>
        </fieldset>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
    </form>
</body>
</html>
