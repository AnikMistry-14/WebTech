<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Portal Layout</title>
    <link rel="stylesheet" href="Task-13.css">
</head>
<body>
    <div id="sidebar" style="display: inline-block; width: 18%; background-color: rgb(223, 9, 9); padding: 10px; margin: 0; border: 1px solid #ccc;">
        <h2>Categories</h2>
        <p>Category 1</p>
        <p>Category 2</p>
        <p>Category 3</p>
    </div>
    
    <div id="main-content" style="display: inline-block; width: 58%; background-color: rgb(8, 222, 90); padding: 10px; margin: 0; border: 1px solid #ccc;">
        <h2>Main Articles</h2>
        <p>Article 1: Lorem ipsum dolor sit amet.</p>
        <p>Article 2: Consectetur adipiscing elit.</p>
        <p>Article 3: Sed do eiusmod tempor incididunt.</p>
    </div>
    
    <div id="advertisement" style="display: inline-block; width: 18%; background-color: rgb(239, 239, 7); padding: 10px; margin: 0; border: 1px solid #ccc;">
        <h2>Advertisements</h2>
        <p>Ad 1: Buy now!</p>
        <p>Ad 2: Special offer!</p>
        <p>Ad 3: Limited time deal!</p>
    </div>
</body>
</html>
